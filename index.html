<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>MagnetHub — Universal Torrent Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div class="max-w-5xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-indigo-400">MagnetHub</h1>
        <p class="text-xs text-slate-400">Multi-Index Torrent & Magnet Search PWA</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="installBtn" class="hidden px-3 py-1.5 text-sm font-medium bg-indigo-600 hover:bg-indigo-500 rounded-lg transition">
          Install App
        </button>
        <button id="savedTabBtn" class="px-3 py-1.5 text-sm font-medium bg-slate-800 hover:bg-slate-700 rounded-lg transition">
          Saved (<span id="savedCount">0</span>)
        </button>
      </div>
    </header>

    <!-- Search Bar -->
    <form id="searchForm" class="mt-6 flex gap-2">
      <input
        id="searchInput"
        type="text"
        placeholder="Search movies, TV shows, software, games..."
        class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500"
        required
      />
      <button
        type="submit"
        class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm rounded-xl transition"
      >
        Search
      </button>
    </form>

    <!-- Status & Filters -->
    <div class="mt-4 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
      <span id="statusText">Enter a query to search across multi-site indexes.</span>
      <div class="flex items-center gap-2">
        <label for="sortSelect">Sort:</label>
        <select id="sortSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-slate-200">
          <option value="seeds">Most Seeds</option>
          <option value="peers">Most Peers</option>
          <option value="size">Largest Size</option>
        </select>
      </div>
    </div>

    <!-- Results List -->
    <main id="resultsContainer" class="mt-4 space-y-3"></main>
  </div>

  <script>
    // PASTE YOUR CLOUDFLARE WORKER URL HERE:
    const WORKER_URL = "https://torrentsearchproxy.sachin-acharya13.workers.dev/";

    let currentResults = [];
    let showingSaved = false;
    let savedItems = JSON.parse(localStorage.getItem("saved_magnets") || "[]");

    // Inline PWA Manifest & Service Worker
    const manifest = {
      name: "MagnetHub Torrent Search",
      short_name: "MagnetHub",
      start_url: ".",
      display: "standalone",
      background_color: "#020617",
      theme_color: "#0f172a",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>🧲</text></svg>",
        sizes: "512x512",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    if ("serviceWorker" in navigator) {
      const swCode = "self.addEventListener('fetch', () => {});";
      const swBlob = new Blob([swCode], { type: "application/javascript" });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove("hidden");
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.add("hidden");
    });

    const updateSavedCount = () => {
      document.getElementById("savedCount").textContent = savedItems.length;
    };
    updateSavedCount();

    const renderResults = (items) => {
      const container = document.getElementById("resultsContainer");
      if (!items.length) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-900/50 rounded-xl border border-slate-800">No torrents found.</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const isSaved = savedItems.some(s => s.magnet === item.magnet);
        return `
          <div class="p-4 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1.5 min-w-0 flex-1">
              <h2 class="font-medium text-sm text-slate-100 break-words">${item.title}</h2>
              <div class="flex flex-wrap items-center gap-2 text-xs">
                <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300">${item.size}</span>
                <span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 font-semibold">▲ ${item.seeds} Seeds</span>
                <span class="px-2 py-0.5 rounded bg-amber-950 text-amber-400">▼ ${item.peers} Peers</span>
                <span class="px-2 py-0.5 rounded bg-indigo-950 text-indigo-300">${item.source}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <a href="${item.magnet}" class="px-3 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 rounded-lg transition">
                Open Magnet
              </a>
              <button onclick='copyMagnet(${JSON.stringify(item.magnet)})' class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 rounded-lg transition">
                Copy
              </button>
              <button onclick='toggleSave(${JSON.stringify(item)})' class="px-3 py-2 text-xs ${isSaved ? "bg-rose-900/60 text-rose-300" : "bg-slate-800 hover:bg-slate-700"} rounded-lg transition">
                ${isSaved ? "Remove" : "Save"}
              </button>
            </div>
          </div>
        `;
      }).join("");
    };

    window.copyMagnet = (magnet) => {
      navigator.clipboard.writeText(magnet);
      document.getElementById("statusText").textContent = "Magnet link copied to clipboard.";
    };

    window.toggleSave = (item) => {
      const idx = savedItems.findIndex(s => s.magnet === item.magnet);
      if (idx > -1) savedItems.splice(idx, 1);
      else savedItems.push(item);
      localStorage.setItem("saved_magnets", JSON.stringify(savedItems));
      updateSavedCount();
      renderResults(showingSaved ? savedItems : currentResults);
    };

    document.getElementById("savedTabBtn").addEventListener("click", () => {
      showingSaved = !showingSaved;
      document.getElementById("savedTabBtn").classList.toggle("bg-indigo-600", showingSaved);
      document.getElementById("statusText").textContent = showingSaved ? "Showing saved magnets." : `Showing ${currentResults.length} results.`;
      renderResults(showingSaved ? savedItems : currentResults);
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      const by = e.target.value;
      const list = showingSaved ? [...savedItems] : [...currentResults];
      list.sort((a, b) => by === "size" ? b.sizeBytes - a.sizeBytes : b[by] - a[by]);
      renderResults(list);
    });

    document.getElementById("searchForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      showingSaved = false;
      document.getElementById("savedTabBtn").classList.remove("bg-indigo-600");
      const query = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("statusText");
      status.textContent = `Searching multi-site indexes for "${query}"...`;

      try {
        const res = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        currentResults = data.results || [];
        status.textContent = `Found ${currentResults.length} deduplicated results for "${query}".`;
        renderResults(currentResults);
      } catch (err) {
        status.textContent = "Error reaching Cloudflare Worker. Check your WORKER_URL.";
      }
    });
  </script>
</body>
</html>
